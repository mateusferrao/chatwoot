# Fork Automato: build da imagem Docker do Chatwoot edição CE (Community, MIT).
#
# - Pull requests que mexem no build: só compila (valida que a imagem gera), sem publicar.
# - Disparo manual (Actions > "Fork - imagem CE" > Run workflow) ou push de tag
#   "release-*": compila e publica em ghcr.io/<dono>/<repo>. Exceção: disparo manual com
#   "testar_emergencia" marcado roda só o build de prova de emergência e não publica nada.
#
# - Job "Build com pacotes da Chatwoot indisponíveis": prova de que o modo de emergência
#   (cópias em vendor/fork-mirror/) gera a imagem. Roda em PR que toca a cópia ou no
#   disparo manual com "testar_emergencia" marcado. Nunca publica.
#
# A imagem é gerada aqui (runner do GitHub) e NÃO na VPS: o build (bundle + Vite)
# exige bem mais CPU/RAM do que o servidor de produção tem sobrando.
# Detalhes e uso no Easypanel: docs/fork/deploy-easypanel.md

name: Fork - imagem CE

on:
  pull_request:
    paths:
      - '.github/workflows/fork-ce-image.yml'
      - 'ops/**'
      - 'docker/**'
      - 'vendor/fork-mirror/**'
      - 'Gemfile.lock'
      - 'pnpm-lock.yaml'
  push:
    tags:
      - 'release-*'
  workflow_dispatch:
    inputs:
      testar_emergencia:
        description: 'Rodar somente o build de prova com os pacotes da Chatwoot Inc. indisponíveis (nada é publicado)'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-ce-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # O ensaio de emergência (dispatch com testar_emergencia) nunca publica nada.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.testar_emergencia) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar edição CE (remove enterprise/) e healthcheck
        env:
          CI: 'true'
        run: |
          ops/scripts/strip-enterprise.sh
          echo -en '\nENV CW_EDITION="ce"' >> docker/Dockerfile
          # Sem healthcheck, o "zero downtime" do Easypanel/Swarm troca o container
          # antes do Rails terminar de subir (~1-2 min fora do ar a cada deploy).
          # start-period cobre db:chatwoot_prepare + fork:branding:apply no boot.
          echo -en '\nHEALTHCHECK --interval=30s --timeout=10s --start-period=300s --retries=3 CMD ["sh", "/app/ops/docker/healthcheck.sh"]\n' >> docker/Dockerfile
          tail -n 3 docker/Dockerfile

      - name: Definir nome e tags da imagem
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          upstream_version="$(tr -d '[:space:]' < ops/UPSTREAM_VERSION)"
          short_sha="${GITHUB_SHA::7}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tags="${image}:${GITHUB_REF_NAME}"
          else
            tags="${image}:${upstream_version}-ce-${short_sha}"
          fi
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            tags="${tags},${image}:latest-ce"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Tags: ${tags}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (e push fora de PR)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Chatwoot CE (fork Automato)
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=fork-ce-amd64
          cache-to: type=gha,mode=max,scope=fork-ce-amd64,ignore-error=true

  # Decide se o build de prova roda: disparo manual com o input marcado, ou PR que
  # mexe na cópia dos pacotes (o filtro "paths" acima também cobre ops/** e docker/**).
  escopo-emergencia:
    name: Decidir se o build de emergência se aplica
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.testar_emergencia)
    outputs:
      rodar: ${{ steps.decidir.outputs.rodar }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Decidir
        id: decidir
        run: |
          rodar=false
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            rodar=true
          elif git diff --name-only HEAD^1 HEAD | grep -Eq '^(vendor/fork-mirror/|ops/scripts/.*vendored)'; then
            rodar=true
          fi
          echo "rodar=${rodar}" >> "$GITHUB_OUTPUT"
          echo "Build de emergência: ${rodar}"

  build-emergencia:
    name: Build com pacotes da Chatwoot indisponíveis
    needs: escopo-emergencia
    permissions:
      contents: read
    if: needs.escopo-emergencia.outputs.rodar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Aplicar o modo de emergência e gerar o Dockerfile derivado
        run: ops/scripts/use-vendored-packages.sh --dockerfile tmp/Dockerfile.emergencia

      - name: Conferir que as gems da Chatwoot vêm de vendor/fork-mirror e não do RubyGems
        run: |
          for gem in ai-agents twitty; do
            grep -Eq "^  remote: vendor/fork-mirror/gems/${gem}-[0-9.]+$" Gemfile.lock \
              || { echo "ERRO: ${gem} não está numa seção PATH do Gemfile.lock"; exit 1; }
            # Dentro do bloco GEM (RubyGems) a gem não pode aparecer.
            if awk '/^GEM$/{in_gem=1; next} /^[A-Z]/{in_gem=0} in_gem' Gemfile.lock | grep -Eq "^    ${gem} \("; then
              echo "ERRO: ${gem} ainda é resolvida pelo RubyGems"; exit 1
            fi
          done
          echo "ai-agents e twitty vêm de PATH."

      - name: Bloquear o escopo @chatwoot do npm e instalar
        run: |
          echo '@chatwoot:registry=http://127.0.0.1:9/' > .npmrc
          pnpm install --frozen-lockfile
          # O mesmo bloqueio vale dentro do build da imagem (o Dockerfile só copia package.json e o lockfile).
          sed -i 's|^RUN pnpm i$|RUN echo "@chatwoot:registry=http://127.0.0.1:9/" >> .npmrc\nRUN pnpm i|' tmp/Dockerfile.emergencia
          grep -q '^RUN echo "@chatwoot:registry' tmp/Dockerfile.emergencia

      - name: Preparar edição CE (remove enterprise/)
        env:
          CI: 'true'
        run: |
          ops/scripts/strip-enterprise.sh
          echo -en '\nENV CW_EDITION="ce"' >> tmp/Dockerfile.emergencia

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (nunca publica)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tmp/Dockerfile.emergencia
          platforms: linux/amd64
          push: false
          tags: fork-ce-emergencia:teste
