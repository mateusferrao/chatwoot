          attributes:
            inbox:
              other_account: 'must belong to the same account as the team'
            inbox_id:
              taken: 'is already in another agent team'
  helpers:
    label:
      automato_agents__account_setting:
        account: 'Account'
        enabled: 'Enabled'
        default_model: 'Default model'
        budget_policy: 'Budget policy'
        monthly_budget_brl: 'Monthly budget'
      automato_agents__team:
        account: 'Account'
        name: 'Name'
        enabled: 'Enabled'
        inboxes: 'Inboxes'
  automato_agents:
    errors:
      inbox_linked_to_another_bot: "The inbox '%{inbox}' is already linked to another bot. Remove that link before adding the inbox to an agent team."
    super_admin:
      team_inboxes:
        none: 'No inboxes'
        empty: 'This account has no inboxes yet.'
        hint: 'Pick inboxes of the team account only.'
